name: Build Frontend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Gerar build frontend
        working-directory: frontend
        run: npm run build

      - name: Salvar pasta dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
