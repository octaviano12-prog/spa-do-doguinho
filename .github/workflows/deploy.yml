name: Deploy SPA Doguinho

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aguardar Hostinger
        run: sleep 40

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Gerar build frontend
        working-directory: frontend
        run: npm run build

      - name: Publicar backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 82.25.67.85
          username: u953887285
          password: Octa1599512369@
          port: 21
          protocol: ftp
          timeout: 120000
          local-dir: backend/
          server-dir: /domains/spadodoguinho.com.br/backend/
          dangerous-clean-slate: false

      - name: Publicar frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 82.25.67.85
          username: u953887285
          password: Octa1599512369@
          port: 21
          protocol: ftp
          timeout: 120000
          local-dir: frontend/dist/
          server-dir: /domains/spadodoguinho.com.br/public_html/
          dangerous-clean-slate: false
